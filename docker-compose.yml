version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: estatehub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - estatehub-net

  # Single-node Kafka in KRaft mode (no separate Zookeeper needed).
  kafka:
    image: bitnami/kafka:3.7
    container_name: estatehub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - estatehub-net

  duplicate-detector:
    build:
      context: ./services/duplicate-detector
    container_name: estatehub-duplicate-detector
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      GRPC_PORT: 50051
      MONGO_URI: mongodb://mongo:27017/estatehub
    networks:
      - estatehub-net

  notification-consumer:
    build:
      context: ./services/notification-consumer
    container_name: estatehub-notification-consumer
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - estatehub-net

  server:
    build:
      context: ./server
    container_name: estatehub-server
    restart: unless-stopped
    depends_on:
      - mongo
      - kafka
      - duplicate-detector
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/estatehub
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      KAFKA_BROKER: kafka:9092
      DUPLICATE_SERVICE_URL: duplicate-detector:50051
    volumes:
      - uploads_data:/app/uploads
    networks:
      - estatehub-net

  client:
    build:
      context: ./client
    container_name: estatehub-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
    networks:
      - estatehub-net

volumes:
  mongo_data:
  uploads_data:
  kafka_data:

networks:
  estatehub-net:
    driver: bridge
